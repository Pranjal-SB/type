# TYPE Slate — the shipped default.
#
# Every neutral is a step on one ramp at one hue, a cool blue-grey near 218°,
# and every accent is placed against that ramp deliberately. Widgets name a
# step; they never mix their own. A palette assembled colour-by-colour as each
# widget needed one is how "one visual system" gets broken quietly — nothing is
# ever wrong, the greys just drift apart until the editor looks assembled
# rather than designed.
#
# Contrast is checked rather than eyeballed: typ-core/tests/theme.rs computes
# WCAG ratios from these values and fails the build if a role drops below the
# floor its ground asks for — on a dark page, 11.5:1 for body text, 6.5:1 for
# content and 5:1 for the gutter. A light theme's floors are lower and that is
# arithmetic rather than leniency: at equal legibility a dark ground returns
# about 2.5x the ratio. See docs/design/themes.md.

name = "TYPE Slate"
kind = "dark"

[palette]
# Dark to light, each step with a job.
base00 = "#10141b"  # the page
base01 = "#161c25"  # the cursor's line — one step, felt rather than seen
base02 = "#1a212c"  # raised surfaces: the status bar
base03 = "#2a3240"  # borders and rules
base04 = "#7889a0"  # furniture text: line numbers
base05 = "#8495ac"  # quiet content: inactive status segments
base06 = "#a8b3c4"  # secondary content: file names
base07 = "#cdd5e1"  # body text
base08 = "#e6ecf5"  # text on a selection

# The one accent. Focus, links, anything the eye should be drawn to.
accent = "#68a6e4"
accent_bright = "#7fb3e0"  # the same hue, lifted — directories in the tree

# Selections sit on the accent's hue at two depths, so the primary reads as
# "the same thing, more so" rather than as a different feature.
select = "#25344b"
select_primary = "#2b456f"

# Semantic colours, deliberately off the base hue: these mean something, and a
# reader must not have to decide whether a colour is decoration or information.
red = "#ec767f"
amber = "#fcd690"
amber_deep = "#3a3524"
teal = "#56b6c2"

[ui]
fg = "base07"
bg = "base00"
cursor_line_bg = "base01"

# The gutter shares the page's background rather than having one of its own: a
# seam down the left of every file is chrome doing a job the digits already do.
gutter_fg = "base04"
gutter_bg = "base00"
line_number_fg = "base04"
# The current line's number matches body text — "here" is stated by being as
# present as the code, not by being tinted.
line_number_current_fg = "base07"

# The gutter's own step. A whitespace mark, an indent guide and a line number
# are the same kind of furniture, and a palette where each widget invents its
# own grey is how one visual system comes apart quietly.
whitespace = "base04"
indent_guide = "base04"

selection_bg = "select"
selection_fg = "base08"
selection_primary_bg = "select_primary"

bracket_match_fg = "amber"
bracket_match_bg = "amber_deep"

# Chrome sits one surface above the page: the sidebar and the status bar share
# it, and the editor keeps base00. Three regions in one colour is why the tree
# and the editor used to read as a single space no matter what the border did.
chrome_bg = "base02"

border = "base03"
border_focused = "accent"

status_bar_bg = "base02"
status_bar_fg = "base07"
status_bar_inactive_fg = "base05"
status_bar_accent = "accent"

tree_directory_fg = "accent_bright"
tree_file_fg = "base06"

diagnostic_error = "red"
diagnostic_warning = "amber"
diagnostic_info = "accent"
diagnostic_hint = "teal"

# Syntax captures, from tree-sitter. Names are matched by longest defined
# prefix, so `keyword.control` resolves through `keyword` and a grammar TYPE
# has never seen still colours.
#
# Slate has one accent by design, and thirteen new hues would end that. So the
# scopes are placed on the palette that already exists: the accent carries what
# the language *does*, the semantic colours carry literal values, and the base
# ramp carries everything structural. Code reads as the page it sits on rather
# than as a fruit salad.
[syntax]
keyword = "accent"
function = "base08"
type = "accent_bright"
string = "teal"
comment = { fg = "base05", modifiers = ["italic"] }
number = "amber"
constant = "amber"
variable = "base07"
property = "base06"
operator = "base05"
punctuation = "base04"
tag = "accent"
attribute = "teal"
