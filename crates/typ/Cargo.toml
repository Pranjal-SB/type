[package]
name = "typ-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A full IDE in your terminal — non-modal by default with an opt-in vim layer, mouse and keyboard as peers"
readme = "README.md"

[[bin]]
name = "typ"
path = "src/main.rs"

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies]
mimalloc.workspace = true

[dependencies]
anyhow.workspace = true
typ-app.workspace = true
typ-buffer.workspace = true

# `cargo binstall typ-editor` fetches a release archive instead of compiling.
# Every line here is required, because binstall's defaults are wrong for this
# repository in three separate ways:
#
#   - the default templates interpolate the *crate* name, `typ-editor`, and
#     every archive is named for the *binary*, `typ`
#   - `{ archive-suffix }` renders `.tgz` for pkg-fmt = "tgz"; release.yml
#     writes `.tar.gz`, so the extension is a literal
#   - the archive root is the directory `tar`/`Compress-Archive` preserved, so
#     bin-dir carries it
#
# Keep in step with the Package steps in .github/workflows/release.yml. The
# name is built there as `typ-$TAG-$TARGET`, and $TAG has the leading `v`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/typ-v{ version }-{ target }.tar.gz"
bin-dir = "typ-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/typ-v{ version }-{ target }.zip"
pkg-fmt = "zip"

# binstall asks the host for its triple and tries gnu before musl, so on x86_64
# Linux it would reach for the one artifact this milestone exists to stop
# shipping: the glibc build, which does not start on Ubuntu 22.04, Debian 12,
# RHEL 9 or Amazon Linux 2023. Point it at the static build the installer also
# prefers. aarch64 needs no entry — no aarch64 gnu archive is published, so
# binstall's own musl fallback finds the right one unaided.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/typ-v{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "typ-v{ version }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"
