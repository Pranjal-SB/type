[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Matches rust-toolchain.toml. Without it, someone on an older compiler gets a
# wall of syntax errors from edition-2024 code and let-chains instead of cargo
# saying plainly which rustc this needs.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Pranjal-SB/type"
homepage = "https://github.com/Pranjal-SB/type"
keywords = ["editor", "terminal", "tui", "ide"]
categories = ["text-editors", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.29"
# 8.2 stable, not the 9.0 release candidate: a data-loss guard is the last
# place to take an RC.
notify = "8.2"
ratatui = "0.30.2"
# `default-features = false` drops `unicode_lines`, which would make `U+000B`,
# `U+000C`, `U+0085`, `U+2028` and `U+2029` line breaks. That is Unicode Annex
# #14 conformance and it is wrong here: rust-analyzer's line index breaks on a
# line feed and nothing else, ripgrep the same, so a file with a form feed in it
# would put every diagnostic, match and hunk below it one line out. `simd` has
# to come back explicitly -- it is a default feature, and ropey's own docs call
# losing it this way a footgun. Helix pins the identical line.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
toml = "1.1"
unicode-segmentation = "1.11"
unicode-width = "0.2"
# The highlighter Helix extracted and has run since 25.07. Taken for its rope
# support and its injections: `tree-sitter-highlight` wants the whole file as
# one `&[u8]`, which for a rope means `to_string()` on every parse.
tree-house = "0.4"
# tree-house-bindings' TryFrom<LanguageFn> for Grammar is behind this feature,
# off by default. Naming the crate directly turns it on for tree-house's own
# copy via feature unification, without which a compiled-in grammar crate has
# no path into tree-house at all.
tree-house-bindings = { version = "0.3", features = ["tree-sitter-language"] }
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
# ripgrep's walker. Taken for its gitignore semantics — `.gitignore`, `.ignore`,
# nested ignore files, the global one, negations — which is a specification
# rather than a pattern match, and for `build_parallel`: a serial walk of a
# 37,586-file tree measured 2596 ms against the parallel walk's 94.7 ms on this
# machine. 27x is not an optimisation, it is the difference between a picker and
# a hang. Its own thread pool is crossbeam-deque, so no rayon enters the graph.
ignore = "0.4"
# ripgrep's searcher and regex bridge. Taken for two things that are specs
# rather than code: binary detection, and correct handling of encodings and line
# terminators. A project search built on `TextBuffer::find_all` would offer
# forty matches inside a .png, which is worse than offering none.
grep-searcher = "0.1"
grep-regex = "0.1"
# The `Matcher` trait itself, needed to ask a match for its byte offset.
# Helix lists all three for the same reason.
grep-matcher = "0.1"
# The matcher Helix extracted, without the `nucleo` wrapper around it. `nucleo`
# adds a rayon pool and streaming injection; measured here, one thread ranks 50k
# paths against a 6-character needle in 4.51 ms, and it already runs on a worker.
# See docs/plans/m2.8-find.md for the numbers.
# `unicode-segmentation` is already a default feature; naming it makes the
# dependency explicit. `Utf32Str`'s indices are grapheme offsets only because
# that feature collapses each cluster to one char — without it they are char
# offsets, and typ-find's `to_graphemes` would be silently wrong rather than
# failing to build. See crates/typ-find/src/rank.rs.
nucleo-matcher = { version = "0.3", features = ["unicode-segmentation"] }
# musl-only, and only because it was measured. musl's mallocng cost find_all
# 2.48x against glibc — 10.2 ms best-of-five against a 16 ms keystroke budget,
# where glibc managed 4.1 ms. jemalloc puts it back to 4.05 ms. See
# docs/design/distribution.md §4.
mimalloc = { version = "0.1", default-features = false }

# The LSP types, generated from the official metamodel rather than transcribed
# by hand. `lsp-types` 0.97 has had no release since June 2024; Helix vendors a
# fork and Zed pins one by git rev, and neither route is open to a workspace
# that publishes — cargo refuses a git dependency in a published crate.
# rust-analyzer moved here in June 2026 after naming eight defects in the old
# crate, every one of them a transcription error, which is the class codegen
# removes. Aliased so the code reads `lsp_types::` and a future swap is one
# line. See docs/design/lsp.md §2.
#
# `url` rather than owning the conversion: percent-encoding a non-ASCII path is
# a correctness table, not logic, and decoding it wrong opens a different file
# without saying so.
lsp-types = { version = "=0.11.0", package = "gen-lsp-types", features = ["url"] }
# rust-analyzer's own transport. Described as a server scaffold, but
# `Message::read`/`write` are generic over `BufRead`/`Write`, so they frame over
# a child process's pipes just as well. `ReqQueue` correlates request ids in
# both directions, which is the half that gets forgotten: servers send requests
# to the client too — rust-analyzer sends `workspace/configuration`,
# `client/registerCapability` and `window/workDoneProgress/create`.
# Pinned exactly: it went 0.7.9 to 0.10.0 in two months, including two breaking
# commits realigning `Response` to JSON-RPC.
lsp-server = "=0.10.0"
serde_json = "1"
url = "2"

# Version alongside path: cargo resolves the path locally and publishes the
# version, and refuses to publish a crate whose dependencies carry only a path.
typ-core = { path = "crates/typ-core", version = "0.3.0" }
typ-buffer = { path = "crates/typ-buffer", version = "0.3.0" }
typ-registry = { path = "crates/typ-registry", version = "0.3.0" }
typ-panel-editor = { path = "crates/typ-panel-editor", version = "0.3.0" }
typ-panel-tree = { path = "crates/typ-panel-tree", version = "0.3.0" }
typ-app = { path = "crates/typ-app", version = "0.3.0" }
typ-syntax = { path = "crates/typ-syntax", version = "0.3.0" }
typ-find = { path = "crates/typ-find", version = "0.3.0" }
typ-picker = { path = "crates/typ-picker", version = "0.3.0" }
typ-lsp = { path = "crates/typ-lsp", version = "0.3.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
