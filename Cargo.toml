[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
# Matches rust-toolchain.toml. Without it, someone on an older compiler gets a
# wall of syntax errors from edition-2024 code and let-chains instead of cargo
# saying plainly which rustc this needs.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Pranjal-SB/type"
homepage = "https://github.com/Pranjal-SB/type"
keywords = ["editor", "terminal", "tui", "ide"]
categories = ["text-editors", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30.2"
ropey = "1.6"
toml = "1.1"
unicode-segmentation = "1.11"
unicode-width = "0.2"

# Version alongside path: cargo resolves the path locally and publishes the
# version, and refuses to publish a crate whose dependencies carry only a path.
typ-core = { path = "crates/typ-core", version = "0.2.2" }
typ-buffer = { path = "crates/typ-buffer", version = "0.2.2" }
typ-registry = { path = "crates/typ-registry", version = "0.2.2" }
typ-panel-editor = { path = "crates/typ-panel-editor", version = "0.2.2" }
typ-panel-tree = { path = "crates/typ-panel-tree", version = "0.2.2" }
typ-app = { path = "crates/typ-app", version = "0.2.2" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
