name: Release

# Tag-driven. `git tag v0.2.6 && git push --tags` is the whole trigger; nothing
# here fires on a push to main, so a release is never an accident.
#
# Hand-written rather than generated by cargo-dist. cargo-dist buys installers,
# Homebrew and winget on top of this, and is worth adopting when those channels
# matter — but it also writes several hundred lines nobody in this repo has read.
# This is the readable floor: four targets, checksums, provenance, one release.
#
# Every `${{ }}` value that reaches a shell does so through `env:` rather than by
# being pasted into the script text. Interpolation happens before the shell sees
# the line, so a value containing a quote or a semicolon becomes script rather
# than an argument. None of the values here are attacker-controlled today; the
# habit is what makes that stay true.

on:
  push:
    tags: ["v*"]
  # Lets the workflow be exercised against an existing tag without cutting a new
  # one — the first run of a release pipeline should not be the real release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.5)"
        required: true

permissions:
  contents: write
  # Build provenance. `id-token` mints the OIDC token that fetches a short-lived
  # Sigstore signing certificate; `attestations` persists the result. Together
  # they make `gh attestation verify <archive> --repo Pranjal-SB/type` prove the
  # binary came out of this workflow rather than off a laptop.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
      # --verify-tag so a typo in workflow_dispatch fails here rather than
      # producing a release pointing at nothing.
      - name: Create the release, if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be added to it."
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md)."
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    # M2.6 replaces this matrix: the gnu-only Linux row produces a binary linked
    # against the runner's glibc, which as of ubuntu-latest = 24.04 is 2.39 and
    # does not start on Ubuntu 22.04, Debian 12, RHEL 9 or Amazon Linux 2023.
    # See docs/design/distribution.md §1 and gap-analysis defect #45.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      # rust-toolchain.toml is the single source for the compiler; the target
      # triple is the only thing this workflow adds to it.
      - run: rustup show
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" -p typ-editor

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="typ-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/typ" "$name/"
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "typ-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$env:TARGET/release/typ.exe" $name
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD-PARTY-LICENSES.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      # Before upload, so an archive that cannot be attested is never published.
      - name: Attest the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "typ-*.tar.gz, typ-*.zip"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # nullglob so the three patterns this platform did not produce expand
          # to nothing rather than to themselves.
          shopt -s nullglob
          gh release upload "$TAG" \
            typ-*.tar.gz typ-*.tar.gz.sha256 typ-*.zip typ-*.zip.sha256 --clobber
