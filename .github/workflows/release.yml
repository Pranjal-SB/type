name: Release

# Tag-driven. `git tag v0.2.4 && git push --tags` is the whole trigger; nothing
# here fires on a push to main, so a release is never an accident.
#
# Hand-written rather than generated by cargo-dist. cargo-dist buys installers,
# Homebrew and winget on top of this, and is worth adopting when those channels
# matter — but it also writes several hundred lines nobody in this repo has read.
# This is the readable floor: four targets, checksums, one release.

on:
  push:
    tags: ["v*"]
  # Lets the workflow be exercised against an existing tag without cutting a new
  # one — the first run of a release pipeline should not be the real release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.3)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      # --verify-tag so a typo in workflow_dispatch fails here rather than
      # producing a release pointing at nothing.
      - name: Create the release, if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; assets will be added to it."
          else
            gh release create "$tag" --verify-tag --draft \
              --title "$tag" \
              --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md)."
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    # aarch64-unknown-linux-gnu is deliberately absent: it needs a cross linker
    # and this pipeline is worth having before it is worth having completely.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      # rust-toolchain.toml is the single source for the compiler; the target
      # triple is the only thing this workflow adds to it.
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p typ-editor

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="typ-${{ needs.create-release.outputs.tag }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/typ "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "typ-${{ needs.create-release.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/typ.exe" $name
          Copy-Item README.md, LICENSE, CHANGELOG.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nullglob so the three patterns this platform did not produce expand
          # to nothing rather than to themselves.
          shopt -s nullglob
          gh release upload '${{ needs.create-release.outputs.tag }}' \
            typ-*.tar.gz typ-*.tar.gz.sha256 typ-*.zip typ-*.zip.sha256 --clobber
