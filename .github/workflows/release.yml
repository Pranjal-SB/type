name: Release

# Tag-driven. `git tag v0.2.6 && git push --tags` is the whole trigger; nothing
# here fires on a push to main, so a release is never an accident.
#
# Hand-written rather than generated by cargo-dist. cargo-dist buys installers,
# Homebrew and winget on top of this, and is worth adopting when those channels
# matter — but it also writes several hundred lines nobody in this repo has read.
# This is the readable floor: four targets, checksums, provenance, one release.
#
# Every `${{ }}` value that reaches a shell does so through `env:` rather than by
# being pasted into the script text. Interpolation happens before the shell sees
# the line, so a value containing a quote or a semicolon becomes script rather
# than an argument. None of the values here are attacker-controlled today; the
# habit is what makes that stay true.

on:
  push:
    tags: ["v*"]
  # Lets the workflow be exercised against an existing tag without cutting a new
  # one — the first run of a release pipeline should not be the real release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.5)"
        required: true

# Least privilege at the top; each job widens only what it needs. `id-token` and
# `attestations` live on `build` alone, because a workflow-level grant hands the
# signing identity to every job including ones that only talk to the API.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
      # --verify-tag so a typo in workflow_dispatch fails here rather than
      # producing a release pointing at nothing.
      - name: Create the release, if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be added to it."
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md)."
          fi

  build:
    needs: create-release
    permissions:
      contents: write
      # Build provenance. `id-token` mints the OIDC token that fetches a
      # short-lived Sigstore signing certificate; `attestations` persists the
      # result. Together they make
      # `gh attestation verify <archive> --repo Pranjal-SB/type` prove the binary
      # came out of this workflow rather than off a laptop.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The portable Linux build. musl links libc statically, so there is no
          # glibc version to be too new for and one file covers Ubuntu, Debian,
          # RHEL, Alpine, Void and NixOS regardless of age. This is what the
          # installer reaches for and what the README points at.
          #
          # Rust's musl target ships self-contained linking components, so the
          # Rust half of this needs no toolchain. The musl-tools step below is
          # for jemalloc, which is here because it was measured — see the
          # comment on that step.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # arm64 Linux: Graviton, Raspberry Pi, Asahi, arm64 servers. Every
          # editor in the surveyed field ships this and TYPE did not.
          #
          # `release.yml` used to carry a note saying this needed a cross linker
          # and was therefore out of scope. That stopped being true in January
          # 2025, when arm64 runners became free for public repositories — it is
          # a native build on a native runner.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # The dynamically linked Linux build, tracking whatever glibc
          # `ubuntu-latest` currently is. It is not the compatibility build and
          # must not be described as one: v0.2.5 shipped this alone, linked
          # against glibc 2.39, and did not start on Ubuntu 22.04, Debian 12,
          # RHEL 9 or Amazon Linux 2023 — gap-analysis #45.
          #
          # Pinning this row to ubuntu-22.04 was considered and rejected. It
          # buys a 2.35 floor, still misses RHEL 9 and Amazon Linux 2023 at
          # 2.34, and 22.04 begins deprecation on 2026-09-17. Static linking
          # answers the question outright; chasing an old runner does not.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Both Apple targets build on the arm64 runner: the stock toolchain
          # cross-compiles x86_64 without help, which is why macos-13's
          # retirement and macos-15-intel's 2027 sunset are not our problem.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          persist-credentials: false
      # rust-toolchain.toml is the single source for the compiler; the target
      # triple is the only thing this workflow adds to it.
      - run: rustup show
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # mimalloc is C, so cc-rs needs a compiler that targets musl. It is the
      # only C in the graph and it is here because musl's own allocator cost
      # find_all 2.48x — see crates/typ/src/main.rs.
      #
      # CC is set explicitly rather than left to cc-rs's target-prefixed guess.
      # That guess happens to work on amd64 because `musl-tools` pulls in
      # `musl-dev`, which is what actually ships /usr/bin/x86_64-linux-musl-gcc
      # — musl-tools itself installs only musl-gcc and musl-ldd. Relying on a
      # transitive dependency to name a binary the way one crate expects is a
      # bet, and it is not a bet worth taking twice on two architectures.
      # `musl-gcc` is in musl-tools directly on both.
      - if: contains(matrix.target, 'musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # No build cache here, deliberately. A cache entry written by a pull
      # request build is restorable by this workflow, so a poisoned entry would
      # be linked into a signed release binary — and the attestation would
      # faithfully attest to the poisoned artifact. A release is the one build
      # worth paying four minutes to do from scratch.
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" -p typ-editor

      # The notices MIT and Apache-2.0 require to travel with the binary.
      # Generated here rather than committed — see the licences job in ci.yml.
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-about
      - name: Collect third-party licences
        run: cargo about generate --fail about.hbs -o THIRD-PARTY-LICENSES.md

      # The cheapest possible check that the thing built is a thing that runs.
      # Only where the runner's architecture matches the target: the arm64
      # runner cannot execute an x86_64 binary and the macOS rows are
      # cross-compiled. The real verification is the release `verify` job.
      - if: contains(matrix.target, 'linux')
        env:
          TARGET: ${{ matrix.target }}
        run: ./target/$TARGET/release/typ --version

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="typ-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/typ" "$name/"
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "typ-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$env:TARGET/release/typ.exe" $name
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD-PARTY-LICENSES.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      # Before upload, so an archive that cannot be attested is never published.
      - name: Attest the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "typ-*.tar.gz, typ-*.zip"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # nullglob so the three patterns this platform did not produce expand
          # to nothing rather than to themselves.
          shopt -s nullglob
          gh release upload "$TAG" \
            typ-*.tar.gz typ-*.tar.gz.sha256 typ-*.zip typ-*.zip.sha256 --clobber

  # Download what was just uploaded, check the sum, and run it.
  #
  # Four tags and two releases shipped before anyone did this by hand, and when
  # someone finally did, the Linux artifact turned out not to start on most
  # Linux — gap-analysis #45 and #48. A build that compiles is not a release
  # that works, and the gap between those two had no owner.
  #
  # Only rows whose runner can execute the target: an x86_64 runner cannot run
  # an aarch64 binary. x86_64-apple-darwin is the one archive nothing here
  # executes — the arm64 macOS runner would need Rosetta and a verification step
  # that depends on an emulator is a verification step that fails for reasons
  # unrelated to the artifact. It is still checksummed and attested.
  verify:
    needs: [create-release, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Verify (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="typ-$TAG-$TARGET"
          gh release download "$TAG" --repo "$REPO" -p "$name.tar.gz" -p "$name.tar.gz.sha256"
          shasum -a 256 -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          got=$("./$name/typ" --version)
          echo "$got"
          # The tag is the claim; the binary is the evidence. A release whose
          # binary reports a different version than its tag is worse than a
          # failed release, because nothing downstream will notice.
          test "$got" = "typ ${TAG#v}"
          test -s "$name/THIRD-PARTY-LICENSES.md"

      - name: Verify (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "typ-$env:TAG-$env:TARGET"
          gh release download $env:TAG --repo $env:REPO -p "$name.zip" -p "$name.zip.sha256"
          $want = (Get-Content "$name.zip.sha256").Split(" ")[0]
          $got  = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Expand-Archive -Path "$name.zip" -DestinationPath .
          $v = & "./$name/typ.exe" --version
          Write-Host $v
          $expect = "typ " + $env:TAG.TrimStart("v")
          if ($v -ne $expect) { throw "version mismatch: '$v' vs '$expect'" }
          if (-not (Test-Path "$name/THIRD-PARTY-LICENSES.md")) { throw "licence notices missing" }

  # Publishing is the last step, not the first. The draft exists so that a
  # release which fails verification is a draft nobody saw rather than a tag
  # people have already installed — and with immutable releases enabled, a
  # published release cannot be quietly corrected afterwards.
  publish:
    needs: [create-release, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A hyphen in a semver tag means a prerelease: v0.2.6-rc.1 should not
          # become the thing `install.sh` resolves as latest.
          case "$TAG" in
            *-*) pre="--prerelease" ;;
            *)   pre="--latest" ;;
          esac
          gh release edit "$TAG" --repo "$REPO" --draft=false $pre
