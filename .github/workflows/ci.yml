name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Any job needing more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs rather than tags. A tag is a mutable
# pointer: `@v4` can be moved to a different commit by anyone who can push a
# tag to that repository, and a compromised action runs with this workflow's
# token. Dependabot updates the SHAs weekly and keeps the version comment.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No toolchain pinned here: rust-toolchain.toml is the single source, and
      # `rustup show` installs exactly what it names, components included.
      # Naming a version in both places is how they drift apart.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Advisories and licenses, configured in deny.toml. One platform is enough —
  # the dependency graph does not vary by runner.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # This repository is more prose than code — 19k lines of documentation and
  # plans against 18k of Rust — and a typo in a design document survives every
  # other check in this file.
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  # Static analysis of the workflows themselves. The class of bug it finds has
  # no other detector here: template injection through `${{ }}` into a `run:`
  # block, over-broad `permissions`, unpinned actions, and artifact steps that
  # leak a token. CI configuration is the one code in this repo that no test
  # covers.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  # MIT and Apache-2.0 both require their notices to travel with a binary that
  # contains the code. 106 crates are compiled into `typ`, so the release
  # archive owes 106 notices, generated by cargo-about at package time.
  #
  # This job checks that the generation still works — a new dependency whose
  # licence text cannot be found fails the pull request that added it, rather
  # than the release three weeks later. It does not compare against a committed
  # file: cargo-about picks a different representative text for a shared licence
  # group depending on which crate it walks first, so the output differs between
  # a Windows laptop and a Linux runner while describing exactly the same set of
  # licences. Committing an artifact that cannot be reproduced is how you get a
  # check that fails for reasons nobody can act on.
  #
  # deny.toml answers a different question: it decides whether a licence is one
  # we may ship. This decides whether we hold its text to hand over. A crate can
  # pass the first and fail the second.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-about
      - name: Every crate in the graph resolves a licence text
        run: |
          # --fail turns an unresolvable licence into a non-zero exit rather
          # than a "NOT FOUND" block quietly shipped inside the archive.
          cargo about generate --fail about.hbs -o /tmp/THIRD-PARTY-LICENSES.md
          echo "resolved $(grep -c '^## ' /tmp/THIRD-PARTY-LICENSES.md) licence blocks"

  # The release matrix, built at pull-request time rather than at tag time.
  #
  # Nothing here used to exercise release.yml at all, which is how a Linux
  # artifact linked against GLIBC_2.39 survived four tags — gap-analysis #45.
  # The two rows that can break independently of everything else are the musl
  # ones: they are the only builds that compile C (mimalloc), the only ones
  # needing a toolchain the runner does not ship, and aarch64 is the only row
  # whose runner nobody has a local copy of.
  #
  # Build and run only. Packaging, checksums, attestation and publishing stay
  # in release.yml; this answers "does the matrix still compile and does the
  # binary start", which is the question that was going unasked.
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      # Mirrors release.yml. musl-gcc rather than a target-prefixed name: that
      # one comes from musl-dev transitively, and betting on its spelling across
      # two architectures is what this job exists to avoid needing to do.
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" -p typ-editor
      - name: It is static, and it starts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/typ"
          file "$bin"
          # A dynamically linked "portable" build is the bug this milestone
          # exists to fix, so assert the property rather than eyeball it.
          #
          # Assert the absence of dynamic linking rather than the presence of a
          # particular spelling: x86_64-musl reports `static-pie linked` and
          # aarch64-musl reports plain `statically linked`, and the first
          # version of this check failed a perfectly good arm64 binary for
          # saying the second one.
          if file "$bin" | grep -q 'dynamically linked'; then
            echo "::error::$TARGET is dynamically linked"; exit 1
          fi
          test "$(strings -a "$bin" | grep -c GLIBC_ || true)" = 0
          ./target/$TARGET/release/typ --version

  # The single check the branch ruleset requires.
  #
  # A matrix job does not report a status under its own name: `test` publishes
  # `test (ubuntu-latest)`, `test (windows-latest)` and `test (macos-latest)`,
  # and a ruleset asking for `test` waits forever for a check that is never
  # sent. Naming the three explicitly would work until the matrix changes, at
  # which point the ruleset silently stops covering the new row.
  #
  # So the ruleset requires this one job, and this job requires everything
  # else. Adding a check above is then a change to this file only.
  ci-ok:
    if: always()
    needs: [test, deny, typos, workflows, licenses, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every dependency succeeded
        env:
          RESULT: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULT"
          for r in $RESULT; do
            [ "$r" = "success" ] || { echo "::error::a required job reported '$r'"; exit 1; }
          done
