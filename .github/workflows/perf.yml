name: Perf

# The budgets in AGENTS.md and architecture §4 are the project's stated
# identity — sub-100 ms cold start, p99 keystroke to painted glyph under 16 ms,
# no dropped frames scrolling 100k lines — and until this file existed nothing
# enforced them. A regression was caught only when a human remembered to look.
# That is gap-analysis defect #18.
#
# Weekly rather than per-pull-request, deliberately. A shared runner's wall
# clock is not a budget gate: the perf tests already take a mutex because
# parallel test threads made `InsertChar` read 32 µs against the 1.9 µs it
# actually costs, and a hosted runner adds a noisy neighbour on top of that. A
# red check that fires on unrelated pull requests trains everyone to ignore it,
# which is worse than no check.
#
# So this is a tripwire, not a gate. It says "something moved, go measure it
# properly" — best-of-five on a quiet machine, per AGENTS.md.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # --release because a debug timing is not a measurement of anything, and
      # --nocapture because the numbers are printed rather than asserted in
      # every case.
      - name: Buffer budgets
        run: cargo test --release -p typ-buffer --test perf -- --ignored --nocapture

      - name: Editor budgets, edit and paint
        run: cargo test --release -p typ-panel-editor --test perf -- --ignored --nocapture

      # Everything below was missing until M3, which is gap-analysis defect
      # #54: this workflow ran two of the seven perf files that existed, and
      # the five it skipped included the one holding
      # `cold_start_stays_under_a_tenth_of_a_second` — the budget this file's
      # own header names as the reason it exists. A file added since was
      # invisible to the tripwire by default rather than by decision.
      #
      # One step per file rather than one `cargo test --workspace`, because a
      # step name is what a failing run shows first and "Find budgets, the
      # walk" says more than a crate name does.
      - name: Editor budgets, first frame
        run: cargo test --release -p typ-panel-editor --test perf_startup -- --ignored --nocapture

      - name: App budgets, including the tab switch
        run: cargo test --release -p typ-app --test perf -- --ignored --nocapture

      - name: App budgets, the sub-100 ms cold start
        run: cargo test --release -p typ-app --test perf_startup -- --ignored --nocapture

      - name: Find budgets, ranking
        run: cargo test --release -p typ-find --test perf -- --ignored --nocapture

      # Its own binary on purpose: M2.8 measured ranking at 3.7 ms alone and
      # 11.9 ms after a sibling in the same binary had touched ten thousand
      # files. The mutex serialises execution and does not reset the page
      # cache, so the split has to survive into CI too.
      - name: Find budgets, the walk
        run: cargo test --release -p typ-find --test perf_fs -- --ignored --nocapture

      - name: LSP budgets, conversion and sync
        run: cargo test --release -p typ-lsp --test perf -- --ignored --nocapture

      - name: LSP budgets, spawning a server
        run: cargo test --release -p typ-lsp --test perf_proc -- --ignored --nocapture
