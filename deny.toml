# cargo-deny — supply chain gate, run in CI on every push and pull request.
#
# Two questions it answers that `cargo test` cannot: does anything in the tree
# have a published advisory against it, and is every license in the graph one a
# MIT project can actually ship.

[advisories]
version = 2
# Deny by default. An unmaintained crate that is otherwise fine gets an
# explicit `ignore = ["RUSTSEC-...."]` entry here with a reason beside it,
# rather than a blanket downgrade that hides the next real one.
yanked = "deny"

[licenses]
version = 2
# Every license currently in the graph, listed rather than pattern-matched, so
# a new dependency carrying something unexpected fails CI instead of sliding in
# under a wildcard.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",       # clipboard-win, error-code
    "Zlib",          # foldhash
    "ISC",           # inotify, inotify-sys — the Linux half of the file watcher
    "CC0-1.0",       # notify itself
    "Unicode-3.0",   # unicode-ident
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",         # terminfo — permissive, if unserious
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
